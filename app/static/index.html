<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAB Assignment</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid #262a33;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #9aa0ab; }
  #modeToggle {
    display: flex;
    gap: 6px;
    background: #1b1e26;
    border: 1px solid #262a33;
    border-radius: 8px;
    padding: 3px;
  }
  #modeToggle button {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: #9aa0ab;
    font-size: 12px;
    cursor: pointer;
  }
  #modeToggle button.active { background: #2563eb; color: white; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { max-width: 760px; padding: 12px 16px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2563eb; color: white; }
  .msg.bot { align-self: flex-start; background: #1b1e26; border: 1px solid #262a33; }
  .meta { margin-top: 10px; font-size: 12px; color: #9aa0ab; }
  .chip {
    display: inline-block;
    margin: 3px 4px 0 0;
    padding: 3px 8px;
    border-radius: 6px;
    background: #262a33;
    color: #c7cbd4;
  }
  details.trace { margin-top: 10px; font-size: 12px; color: #9aa0ab; }
  details.trace summary { cursor: pointer; color: #8ab4ff; }
  .trace-step {
    margin: 6px 0;
    padding: 8px 10px;
    background: #14161c;
    border: 1px solid #262a33;
    border-radius: 6px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    white-space: pre-wrap;
  }
  #inputBar {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-top: 1px solid #262a33;
  }
  #question {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #333844;
    background: #1b1e26;
    color: #e6e6e6;
    font-size: 14px;
  }
  button.ask {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button.ask:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <div>
    <h1>FAB Documenta</h1>
    <p>Multi-agent financial analysis over FAB's quarterly statements (2022–2024).</p>
  </div>
  <div id="modeToggle">
    <button id="agentModeBtn" class="active">Agent (multi-hop)</button>
    <button id="retrievalModeBtn">Retrieval only</button>
  </div>
</header>
<div id="chat"></div>
<div id="inputBar">
  <input id="question" type="text" placeholder="e.g. What was the YoY change in Net Profit between Q3 2023 and Q3 2024?" />
  <button class="ask" id="askBtn">Ask</button>
</div>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('question');
  const btn = document.getElementById('askBtn');
  const agentModeBtn = document.getElementById('agentModeBtn');
  const retrievalModeBtn = document.getElementById('retrievalModeBtn');
  let mode = 'agent';

  agentModeBtn.addEventListener('click', () => setMode('agent'));
  retrievalModeBtn.addEventListener('click', () => setMode('retrieval'));

  function setMode(m) {
    mode = m;
    agentModeBtn.classList.toggle('active', m === 'agent');
    retrievalModeBtn.classList.toggle('active', m === 'retrieval');
  }

  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addBotMessage({ answer, citations, sources, trace, iterations, elapsed_seconds }) {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.textContent = answer;

    const cites = citations || sources;
    if (cites && cites.length) {
      const s = document.createElement('div');
      s.className = 'meta';
      s.textContent = 'Sources: ';
      const seen = new Set();
      cites.forEach(c => {
        const key = `${c.period}|${c.page}|${c.source}`;
        if (seen.has(key)) return;
        seen.add(key);
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = `${c.period} · p.${c.page} · ${c.source}`;
        s.appendChild(chip);
      });
      div.appendChild(s);
    }

    if (trace && trace.length) {
      const details = document.createElement('details');
      details.className = 'trace';
      const summary = document.createElement('summary');
      summary.textContent = `Agent trace (${iterations} tool call${iterations === 1 ? '' : 's'}, ${elapsed_seconds}s)`;
      details.appendChild(summary);
      trace.forEach((step, i) => {
        const pre = document.createElement('div');
        pre.className = 'trace-step';
        pre.textContent = `${i + 1}. ${step.call}(${JSON.stringify(step.args)})\n   -> ${JSON.stringify(step.result).slice(0, 300)}`;
        details.appendChild(pre);
      });
      div.appendChild(details);
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addErrorMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function ask() {
    const question = input.value.trim();
    if (!question) return;
    addUserMessage(question);
    input.value = '';
    btn.disabled = true;

    const endpoint = mode === 'agent' ? '/api/agent-query' : '/api/query';

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addErrorMessage('Error: ' + (err.detail || res.statusText));
        return;
      }
      const data = await res.json();
      addBotMessage(data);
    } catch (e) {
      addErrorMessage('Request failed: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', ask);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
